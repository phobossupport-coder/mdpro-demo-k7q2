<style>
:root{
  --ob:#07080A; --s1:#0D0F12; --s2:#14171B; --hair:rgba(236,230,218,.12); --hair2:rgba(236,230,218,.22);
  --ink:#EEEAE2; --soft:#BDB7AC; --mute:#7F7A71;
  --gold:#C2A877; --gold2:#DCC69C;
  --serif:'Cormorant Garamond', Georgia, serif;
  --caps:'Tenor Sans', 'Helvetica Neue', Arial, sans-serif;
  --text:'Onest', 'Segoe UI', Arial, sans-serif;
  --rail:288px;
  color-scheme:dark;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-variant-numeric:lining-nums;height:100%;background:var(--ob);color:var(--ink);font-family:var(--text);font-weight:300;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
img{display:block}
[hidden]{display:none!important}
.caps{font-family:var(--caps);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase}

/* buttons: rectangular, hairline, tracked caps */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:50px;padding:0 28px;border:1px solid var(--hair2);font-family:var(--caps);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;transition:background .25s,color .25s,border-color .25s}
.btn svg{width:14px;height:14px}
.btn:hover{border-color:var(--ink);background:var(--ink);color:var(--ob)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120A}
.btn.gold:hover{background:var(--gold2);border-color:var(--gold2)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%}
.rail{background:var(--s1);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.brand{padding:34px 28px 26px;border-bottom:1px solid var(--hair);text-align:left}
.brand .caps{color:var(--gold);font-size:10.5px}
.brand b{display:block;margin-top:12px;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.05}
.brand span{display:block;margin-top:14px;font-size:12.5px;color:var(--mute)}
.progress{height:1px;background:var(--hair);margin-top:12px}
.progress i{display:block;height:1px;width:0;background:var(--gold);transition:width .4s var(--ease)}
.toc{overflow-y:auto;padding:6px 0 32px;flex:1;scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
.toc h4{font-family:var(--caps);font-weight:400;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding:26px 28px 10px}
.toc h4 i{font-style:normal;color:var(--gold);margin-right:10px}
.toc button{display:grid;grid-template-columns:34px 1fr;gap:6px;width:100%;text-align:left;padding:8px 28px;font-size:13.5px;line-height:1.4;color:var(--soft);transition:color .2s}
.toc button em{font-style:normal;font-family:var(--serif);font-size:16px;line-height:1.2;color:var(--mute)}
.toc button:hover{color:var(--ink)}
.toc button.on{color:var(--ink);background:linear-gradient(90deg,rgba(194,168,119,.10),transparent)}
.toc button.on em{color:var(--gold)}
.toc button.seen em::after{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.7;margin-left:5px;vertical-align:3px}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;isolation:isolate;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s;scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
.slide.on{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.slide:not(.on){pointer-events:none}
.slide.on{z-index:1}

.bar{position:fixed;z-index:30;right:calc(28px + env(safe-area-inset-right, 0px));bottom:calc(24px + env(safe-area-inset-bottom, 0px));display:flex;align-items:stretch;background:rgba(7,8,10,.86);border:1px solid var(--hair);backdrop-filter:blur(12px)}
.bar .count{display:flex;align-items:center;padding:0 18px;font-family:var(--serif);font-size:17px;color:var(--soft);border-right:1px solid var(--hair)}
.bar button{width:48px;height:48px;display:grid;place-items:center;border-left:1px solid var(--hair);transition:background .2s,color .2s}
.bar button:first-of-type{border-left:0}
.bar button:hover{background:var(--ink);color:var(--ob)}
.bar svg{width:16px;height:16px}
.menu{display:none!important}

/* ---------- cover ---------- */
.cover{display:grid;grid-template-columns:1fr 1fr;min-height:100%}
.cover .tx{padding:72px 64px 64px 72px;display:flex;flex-direction:column;justify-content:space-between;gap:56px;position:relative;z-index:1}
.cover .ph{position:relative;overflow:hidden}
.cover .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.cover .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--ob) 0%,rgba(7,8,10,0) 38%),linear-gradient(0deg,rgba(7,8,10,.55),transparent 40%)}
.cover .top .caps{color:var(--gold)}
.cover h1{font-family:var(--serif);font-weight:300;font-size:clamp(56px,6.4vw,112px);line-height:.92;letter-spacing:-.01em;margin-top:28px}
.cover .rule{width:64px;height:1px;background:var(--gold);margin:40px 0 28px}
.cover p.sub{font-size:16.5px;line-height:1.75;color:var(--soft);max-width:40ch}
.cover .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.parts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair)}
.parts button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;padding:13px 16px 13px 0;border-bottom:1px solid var(--hair);transition:color .2s}
.parts button:nth-child(odd){margin-right:24px}
.parts em{font-style:normal;font-family:var(--serif);font-size:16px;color:var(--gold)}
.parts b{font-weight:400;font-size:14px}
.parts span{font-size:12px;color:var(--mute)}
.parts button:hover b{color:var(--gold2)}

/* ---------- part divider ---------- */
.part{min-height:100%;display:grid;align-content:end;padding:72px 72px 112px}
.part .bg{position:absolute;inset:0;z-index:-1}
.part .bg img{width:100%;height:100%;object-fit:cover}
.part .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--ob) 8%,rgba(7,8,10,.72) 45%,rgba(7,8,10,.35) 100%)}
.part .roman{font-family:var(--serif);font-weight:300;font-size:120px;line-height:.8;color:var(--gold)}
.part .meta{color:var(--soft);margin-top:28px}
.part h2{font-family:var(--serif);font-weight:300;font-size:clamp(48px,5.6vw,96px);line-height:.95;margin-top:14px;max-width:14ch}
.part p.sub{margin-top:22px;font-size:17px;line-height:1.7;color:var(--soft);max-width:46ch}
.part ol{list-style:none;margin-top:48px;border-top:1px solid var(--hair2);max-width:860px}
.part li button{display:grid;grid-template-columns:56px 1fr auto;gap:12px;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--hair);font-size:16px;align-items:baseline;transition:color .2s,padding .3s var(--ease)}
.part li em{font-style:normal;font-family:var(--serif);font-size:20px;color:var(--gold)}
.part li small{font-family:var(--serif);font-size:17px;color:var(--mute)}
.part li button:hover{color:var(--gold2);padding-left:8px}

/* ---------- lesson ---------- */
.hero{position:relative;height:max(440px,66vh);overflow:hidden;display:grid;align-content:end}
.hero .img{position:absolute;inset:0;z-index:-1;display:flex;gap:2px}
.hero .img img{flex:1;min-width:0;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--ob) 0%,rgba(7,8,10,.55) 42%,rgba(7,8,10,.05) 75%),linear-gradient(90deg,rgba(7,8,10,.55),transparent 60%)}
.hero .in{padding:0 72px 56px;display:flex;justify-content:space-between;align-items:end;gap:40px}
.hero .caps{color:var(--gold)}
.hero .caps b{font-weight:400;color:var(--soft);margin-left:18px}
.hero h2{font-family:var(--serif);font-weight:300;font-size:clamp(44px,5vw,84px);line-height:.98;letter-spacing:-.005em;margin-top:18px;max-width:16ch}
.hero .num{font-family:var(--serif);font-weight:300;font-size:clamp(110px,13vw,210px);line-height:.75;color:transparent;-webkit-text-stroke:1px rgba(220,198,156,.55);flex:none}

.body{padding:72px 72px 140px;max-width:1340px}
.sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding:56px 0;border-top:1px solid var(--hair)}
.sec:first-child{border-top:0;padding-top:0}
.sec>.caps{color:var(--mute);padding-top:8px}
.sec>div{min-width:0}
.lead{font-family:var(--serif);font-weight:300;font-size:clamp(26px,2.2vw,34px);line-height:1.3;color:var(--ink);max-width:34ch}
.pts{list-style:none;margin-top:40px;counter-reset:p;display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
.pts li{position:relative;padding:20px 0 20px 52px;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.6;color:var(--soft);counter-increment:p}
.pts li::before{content:counter(p, decimal-leading-zero);position:absolute;left:0;top:16px;font-family:var(--serif);font-size:22px;color:var(--gold)}
.tip{margin-top:44px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;padding:32px 0 0;border-top:1px solid var(--gold)}
.tip .caps{color:var(--gold);padding-top:10px;white-space:nowrap}
.tip p{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(22px,1.8vw,28px);line-height:1.4}
.prodbox{margin-top:40px}
.prodbox>.caps{color:var(--gold);margin-bottom:14px}
.prods{display:flex;flex-wrap:wrap;row-gap:8px}
.prods span{font-family:var(--caps);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);padding:6px 18px 6px 0;margin-right:18px;border-right:1px solid var(--hair2)}
.prods span:last-child{border-right:0}

.player{position:relative;background:#000;overflow:hidden;aspect-ratio:16/9;outline:1px solid var(--hair)}
.player video{width:100%;height:100%;display:block;background:#000}
.cover-play{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:22px;background:radial-gradient(ellipse at center,rgba(7,8,10,.15),rgba(7,8,10,.6));color:var(--ink)}
.cover-play i{width:96px;height:96px;border-radius:50%;border:1px solid rgba(238,234,226,.7);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .4s var(--ease)}
.cover-play i svg{width:26px;height:26px;margin-left:4px}
.cover-play:hover i{background:var(--gold);border-color:var(--gold);color:#16120A;transform:scale(1.05)}
.player.started .cover-play{display:none}
.player .missing{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:rgba(7,8,10,.9);font-size:15px;color:var(--soft);line-height:1.6}
.player.err .missing{display:grid}
.vbtns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.vbtns [id^=resume] .btn{border-color:var(--gold);color:var(--gold2)}
.vbtns [id^=resume] .btn:hover{background:var(--gold);color:#16120A}

.frames{display:flex;flex-wrap:wrap;gap:6px}
.frames.even{display:grid;grid-template-columns:repeat(4,1fr)}
.frame{position:relative;overflow:hidden;aspect-ratio:16/9;flex:1.78 1 220px;background:var(--s2)}
.frame.v{aspect-ratio:9/16;flex:.5625 1 60px}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease),filter .4s;filter:saturate(.9)}
.frame:hover img{transform:scale(1.035);filter:saturate(1)}
.frame .tc{position:absolute;left:0;bottom:0;padding:6px 10px;font-family:var(--serif);font-size:16px;background:linear-gradient(0deg,rgba(7,8,10,.8),transparent);width:100%}
.frame .zoom{position:absolute;right:8px;top:8px;width:34px;height:34px;background:rgba(7,8,10,.7);border:1px solid var(--hair2);display:grid;place-items:center;opacity:0;transition:opacity .25s}
.frame:hover .zoom,.frame:focus-within .zoom{opacity:1}
.frame .zoom svg{width:14px;height:14px}
.frame>button.seek{position:absolute;inset:0}
.frame.cur{outline:1px solid var(--gold);outline-offset:-1px}
.frame.cur .tc{color:var(--gold2)}

.nextup{position:relative;display:block;width:100%;height:280px;overflow:hidden;text-align:left;margin-top:16px}
.nextup img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease);filter:brightness(.45)}
.nextup:hover img{transform:scale(1.03)}
.nextup .in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:end;padding:36px 40px}
.nextup .caps{color:var(--gold)}
.nextup b{font-family:var(--serif);font-weight:300;font-size:clamp(30px,3vw,48px);line-height:1.05;margin-top:12px;max-width:22ch}
.nextup .arrow{position:absolute;right:40px;bottom:40px;width:56px;height:56px;border:1px solid var(--hair2);display:grid;place-items:center;transition:background .3s,color .3s}
.nextup:hover .arrow{background:var(--ink);color:var(--ob)}
.nextup .arrow svg{width:18px;height:18px}

/* ---------- demo build ---------- */
.player.demo img{width:100%;height:100%;object-fit:cover;filter:brightness(.35) saturate(.7)}
.demo-note{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px}
.demo-note .caps{color:var(--gold)}
.demo-note p{font-family:var(--serif);font-weight:300;font-size:clamp(22px,2.4vw,34px);line-height:1.25;max-width:24ch}
.demo-note span:last-child{font-size:13.5px;color:var(--soft)}
.demo-flag{margin:-12px 0 28px;padding:12px 16px;border:1px solid var(--gold);color:var(--gold2);font-size:13.5px;line-height:1.6;max-width:52ch}

/* ---------- one-tab notice ---------- */
.tablock{position:fixed;inset:0;z-index:60;background:rgba(4,5,6,.97);display:grid;place-items:center;padding:24px;text-align:center}
.tablock .caps{color:var(--gold)}
.tablock p{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3vw,40px);line-height:1.25;max-width:22ch;margin:18px auto 32px}
img,video{-webkit-user-drag:none;user-select:none}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(4,5,6,.96);display:none;place-items:center;padding:48px 96px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:calc(100vh - 170px);margin:0 auto}
.lb .cap{margin-top:22px;display:flex;gap:24px;justify-content:center;align-items:center;color:var(--soft)}
.lb .x,.lb .arr{position:absolute;width:52px;height:52px;border:1px solid var(--hair2);display:grid;place-items:center;transition:background .2s,color .2s}
.lb .x{top:22px;right:24px}
.lb .arr{top:50%;transform:translateY(-50%)}
.lb .arr.l{left:24px}.lb .arr.r{right:24px}
.lb .x:hover,.lb .arr:hover{background:var(--ink);color:var(--ob)}
.lb svg{width:16px;height:16px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .cover{grid-template-columns:1fr}
  .cover .ph{position:absolute;inset:0;z-index:0;opacity:.45}
  .cover .ph::after{background:linear-gradient(0deg,var(--ob) 30%,rgba(7,8,10,.4))}
  .sec{grid-template-columns:minmax(0,1fr);gap:20px}
  .pts{grid-template-columns:1fr}
}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .rail{position:fixed;inset:0 18% 0 0;z-index:40;transform:translateX(-102%);transition:transform .35s var(--ease)}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(4,5,6,.7)}
  .stage{height:100vh}
  .menu{display:grid!important}
  .cover .tx{padding:48px 16px 110px}
  .parts{grid-template-columns:1fr}
  .parts button:nth-child(odd){margin-right:0}
  .part{padding:48px 16px 110px}
  .part .roman{font-size:84px}
  .hero{height:62vh}
  .hero .in{padding:0 16px 32px}
  .hero .num{display:none}
  .hero .caps b{display:block;margin:10px 0 0}
  .body{padding:40px 16px 120px}
  .sec{padding:40px 0}
  .tip{grid-template-columns:1fr;gap:12px}
  .frames.even{grid-template-columns:repeat(2,1fr)}
  .frame{flex-basis:140px}.frame.v{flex-basis:44px}
  .vbtns .btn{flex:1}
  .nextup{height:220px}
  .nextup .in{padding:24px}
  .nextup .arrow{right:24px;bottom:24px;width:44px;height:44px}
  .bar{right:16px;bottom:16px}
  .lb{padding:72px 16px}
  .lb .arr{top:auto;bottom:24px;transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

let cur = -1;
const firstN = () => lessonSlides[0].l.n, lastN = () => lessonSlides.at(-1).l.n;
// lesson to resume from, or null when there is nothing to resume (not started, still on lesson 01, or course finished)
const resumeId = () => { const l = store.get('last', null); return l && l !== firstN() && l !== lastN() ? l : null; };
function video(el){ return el?.querySelector('video'); }
function ensureSrc(v){
  if (v && !v.src){
    v.preload = 'metadata';
    v.src = videoURL(v.dataset.src);
    v.addEventListener('error', () => v.closest('.player').classList.add('err'), {once:true});
  }
}
function updateSeen(){
  const n = seen.size;
  $('#prog').style.width = (n / lessonSlides.length * 100) + '%';
  $('#seenTxt').textContent = n ? `Просмотрено ${n} из ${lessonSlides.length}` : `${lessonSlides.length} видеоуроков по порядку`;
  document.querySelectorAll('[data-toc]').forEach(b => b.classList.toggle('seen', seen.has(b.dataset.toc)));
  // resume only mid-course: after the final lesson, or before any lesson, the main button starts from lesson 01
  const r = resumeId();
  $('#startTxt').textContent = r ? `Продолжить с урока ${r}` : (store.get('last', null) === lastN() ? 'Начать сначала' : 'Начать с первого урока');
  $('#restartBtn').hidden = !r;
}
function show(i, push = true){
  i = Math.max(0, Math.min(els.length - 1, i));
  if (i === cur) return;
  const old = els[cur]; const v0 = video(old); if (v0 && !v0.paused) v0.pause();
  old?.classList.remove('on');
  cur = i; const el = els[i]; el.classList.add('on'); el.scrollTop = 0;
  const id = el.dataset.id;
  if (push) history.replaceState(null, '', '#' + id);
  $('#count').textContent = (i+1) + ' / ' + els.length;
  document.querySelectorAll('[data-toc]').forEach(b => b.classList.toggle('on', b.dataset.toc === id));
  $('[data-toc="' + id + '"]')?.scrollIntoView({block:'nearest'});
  const v = video(el);
  if (v){
    const pos = store.get('pos:' + id, 0);
    $('#resume-' + id).innerHTML = pos > 20 ? `<button class="btn" data-seek="${pos}">Продолжить с ${fmt(pos)}</button>` : '';
    ensureSrc(v);
    store.set('last', id);
  }
  if (id === 'cover') updateSeen();
  $('#rail').classList.remove('open');
}
function fullVideo(v){
  ensureSrc(v);
  v.closest('.player').classList.add('started');
  (v.requestFullscreen || v.webkitRequestFullscreen || v.webkitEnterFullscreen)?.call(v);
  if (v.paused) v.play().catch(()=>{});
}
const idxOf = id => els.findIndex(e => e.dataset.id === id);
function seek(t){
  const v = video(els[cur]); if (!v) return;
  ensureSrc(v);
  v.closest('.player').classList.add('started');
  const go = () => { v.currentTime = +t; v.play().catch(()=>{}); };
  v.readyState >= 1 ? go() : v.addEventListener('loadedmetadata', go, {once:true});
  v.closest('.player').scrollIntoView({behavior:'smooth', block:'center'});
}

// video events: remember position, mark seen, highlight current frame
document.querySelectorAll('video').forEach(v => {
  const id = v.closest('.slide').dataset.id;
  v.addEventListener('play', () => { v.closest('.player').classList.add('started'); seen.add(id); store.set('seen', [...seen]); updateSeen(); });
  let last = 0;
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime;
    if (Math.abs(t - last) > 5){ last = t; store.set('pos:' + id, t > v.duration - 15 ? 0 : t); }
    const fr = [...v.closest('.slide').querySelectorAll('.frame')];
    let k = -1; fr.forEach((f, j) => { if (t >= +f.dataset.t - 2) k = j; });
    fr.forEach((f, j) => f.classList.toggle('cur', j === k));
  });
  v.addEventListener('dblclick', () => fullVideo(v));
});

// no "save video as" / "save image as" from the context menu, no dragging media out of the page
document.addEventListener('contextmenu', e => { if (e.target.closest('video, img, .player, .frame, .lb')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.closest('img, video')) e.preventDefault(); });

// one tab at a time: a newer tab takes over and the older one shows a notice
const TAB = Math.random().toString(36).slice(2);
let bc = null; try { bc = new BroadcastChannel('mdpro-tab'); } catch(e){}
function lockOut(){
  document.querySelectorAll('video').forEach(v => v.pause());
  $('#tablock').hidden = false;
}
if (bc && !DEMO){
  bc.onmessage = e => { if (e.data?.type === 'open' && e.data.tab !== TAB) lockOut(); };
  bc.postMessage({type: 'open', tab: TAB});
}
$('#tablockBtn').onclick = () => { $('#tablock').hidden = true; bc?.postMessage({type: 'open', tab: TAB}); };

// lightbox
let lbI = 0, lbFrom = null;
function lbShow(i){
  const id = els[cur].dataset.id, m = META[id]; lbI = (i + m.ts.length) % m.ts.length;
  $('#lbImg').src = frameSrc(id, lbI + 1);
  $('#lbImg').alt = `Урок ${id}, кадр на ${fmt(m.ts[lbI])}`;
  $('#lbCap').textContent = `Урок ${id} · кадр ${lbI+1} из ${m.ts.length} · ${fmt(m.ts[lbI])}`;
  if (!$('#lb').classList.contains('on')) lbFrom = document.activeElement;
  $('#lbPlay').hidden = !hasVideo(id);
  $('#lb').classList.add('on'); $('#lbX').focus();
}
const lbClose = () => { $('#lb').classList.remove('on'); lbFrom?.focus?.(); };
$('#lbX').onclick = lbClose;
$('#lbL').onclick = () => lbShow(lbI - 1);
$('#lbR').onclick = () => lbShow(lbI + 1);
$('#lbPlay').onclick = () => { lbClose(); seek(META[els[cur].dataset.id].ts[lbI]); };
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') lbClose(); });

document.addEventListener('click', e => {
  if (e.target.closest('[data-restart]')){ restart(); return; }
  const g = e.target.closest('[data-go]'); if (g){ show(idxOf(g.dataset.go)); return; }
  const s = e.target.closest('[data-seek]'); if (s){ seek(s.dataset.seek); return; }
  const z = e.target.closest('[data-zoom]'); if (z){ lbShow(+z.dataset.zoom); return; }
  const a = e.target.closest('[data-act]'); if (a){
    const v = video(els[cur]);
    if (a.dataset.act === 'start') seek(0);
    if (a.dataset.act === 'full' && v) fullVideo(v);
  }
});
function restart(){ store.set('last', null); show(idxOf(lessonSlides[0].l.n)); }
$('#startBtn').onclick = () => { const r = resumeId(); r ? show(idxOf(r)) : restart(); };
$('#restartBtn').onclick = restart;
$('#prevBtn').onclick = () => show(cur - 1);
$('#nextBtn').onclick = () => show(cur + 1);
$('#menuBtn').onclick = () => $('#rail').classList.toggle('open');
$('#fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.addEventListener('keydown', e => {
  if ($('#lb').classList.contains('on')){
    if (e.key === 'Escape') lbClose();
    if (e.key === 'ArrowLeft') lbShow(lbI - 1);
    if (e.key === 'ArrowRight') lbShow(lbI + 1);
    return;
  }
  // while a video is fullscreen, arrows belong to the video player, not to slide navigation
  if (document.fullscreenElement?.tagName === 'VIDEO') return;
  if (e.target.tagName === 'VIDEO' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); show(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
  if (e.key === 'Escape') $('#rail').classList.remove('open');
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А'){ const v = video(els[cur]); v ? fullVideo(v) : $('#fsBtn').click(); }
});
window.addEventListener('hashchange', () => { const i = idxOf(location.hash.slice(1)); if (i >= 0) show(i, false); });

updateSeen();
show(Math.max(0, idxOf(location.hash.slice(1))), false);
</script>
</body>
</html>
